[project]
name = "inbox-obligation-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "slack-bolt>=1.19",
    "notion-client>=2.2",
    "apscheduler>=3.10",
    "tenacity>=8.3",
    "structlog>=24.1",
    "beautifulsoup4>=4.12",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracker"]
